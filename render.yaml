# Render Blueprint. In the Render dashboard: New > Blueprint, pick this repo.
# DATABASE_URL is entered in the dashboard (sync: false) and never committed.
# DEMO_API_KEY is generated by Render; read it from the dashboard to call /demo.
services:
  - type: web
    name: kasideposit-api
    runtime: python
    # Same region as the Supabase database (eu-central-1): every request makes
    # several database round trips, ~1 ms each in-region instead of ~180 ms.
    region: frankfurt
    # Free instance. What that means for this service:
    # - No pre-deploy command, so migrations do not run on deploy. Run
    #   `python -m alembic upgrade head` from a machine with DATABASE_URL
    #   before deploying a version that adds one. If you forget, startup
    #   refuses the out-of-date schema with a clear message (app/schema_check.py)
    #   rather than serving errors.
    # - It sleeps after 15 minutes without traffic and takes about a minute to
    #   wake, longer than the app's 15-second request timeout. Before a demo,
    #   open /health first, or ping /health every ~10 minutes to keep it awake.
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      # The demo till and float endpoints, behind DEMO_API_KEY (X-Demo-Key header).
      - key: ENABLE_DEMO_ROUTES
        value: "true"
      - key: DEMO_API_KEY
        generateValue: true
      # Encrypts SA ID and bank account numbers (app/pii.py). Entered in the
      # dashboard, and the SAME value as in local .env: both write to the one
      # database. If it is lost, the stored numbers cannot be decrypted.
      - key: PII_KEY
        sync: false
      # Guards POST /internal/sweep (X-Sweep-Key header), which finishes
      # deposits whose depositor stopped polling. Without this variable the
      # route is not mounted and such a deposit stays charged for good: the
      # voucher is spent and the money neither arrives nor comes back. See
      # "Scheduling the sweep" below.
      - key: SWEEP_KEY
        generateValue: true

# Scheduling the sweep
# --------------------
# Nothing inside the process runs on a timer, and a thread would die with the
# instance (free plan, sleeps after 15 minutes). Render's own cron jobs are a
# paid feature, so on the free plan the schedule has to come from outside:
# any pinger (cron-job.org, UptimeRobot, a GitHub Actions `schedule`) calling
#
#     POST https://<service>.onrender.com/internal/sweep
#     X-Sweep-Key: <the generated SWEEP_KEY, from the dashboard>
#
# every few minutes. Safe at any rate: it only advances deposits already due
# to advance, re-checks each under its row lock, and does at most 25 per call
# (`SWEEP_LIMIT`), so overlapping calls cannot double-pay. When the answer
# has "more_likely": true the call filled its budget and more is waiting.
#
# The same request also keeps the instance warm, which is the other thing the
# free plan needs before a demo — so one schedule covers both.
