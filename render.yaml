# Render Blueprint. In the Render dashboard: New > Blueprint, pick this repo.
# DATABASE_URL is entered in the dashboard (sync: false) and never committed.
# DEMO_API_KEY is generated by Render; read it from the dashboard to call /demo.
services:
  - type: web
    name: kasideposit-api
    runtime: python
    # Same region as the Supabase database (eu-central-1): every request makes
    # several database round trips, ~1 ms each in-region instead of ~180 ms.
    region: frankfurt
    # A paid instance: pre-deploy commands (the migrations below) need one, and
    # a free instance sleeps when idle, so the first request after a pause can
    # take longer than the app's 15-second timeout.
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    # Migrate before the new version starts. Startup also refuses a schema that
    # is behind the code, so a skipped migration fails loudly, not with 500s.
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      # The demo till and float endpoints, behind DEMO_API_KEY (X-Demo-Key header).
      - key: ENABLE_DEMO_ROUTES
        value: "true"
      - key: DEMO_API_KEY
        generateValue: true
